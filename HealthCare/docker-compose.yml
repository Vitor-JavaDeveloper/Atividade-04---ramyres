# sobe o healthcare completo com um comando: docker compose up -d --build
# o iniciar.bat ja faz isso sozinho. sao dois containers:
#   db  -> banco postgresql 16 (os dados ficam no volume healthcare_dados e nao somem ao parar)
#   app -> sistema em java com spring boot, que tambem entrega as telas (front-end)
name: healthcare

services:
  db:
    image: postgres:16-alpine
    container_name: healthcare_db
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare123
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5433:5432"   # porta 5433 no windows para nao brigar com algum postgresql ja instalado
    volumes:
      - healthcare_dados:/var/lib/postgresql/data
    healthcheck:      # o app so sobe depois que o banco responder
      test: ["CMD-SHELL", "pg_isready -U healthcare -d healthcare"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: ./codigo
    image: healthcare-app
    container_name: healthcare_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/healthcare
      DB_USER: healthcare
      DB_PASS: healthcare123
      TZ: America/Sao_Paulo
      # fuso de brasilia e limite de memoria do java para nao pesar no computador
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Sao_Paulo -Xmx512m
    ports:
      - "8088:8088"
    restart: on-failure

volumes:
  healthcare_dados:
