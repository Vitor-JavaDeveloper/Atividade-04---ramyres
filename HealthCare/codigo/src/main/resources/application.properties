# configuracoes do healthcare
# porta onde o sistema abre. escolhemos 8088 para nao brigar com outros projetos que usam 8080.
server.port=8088

# conexao com o postgresql. os valores vem das variaveis de ambiente do docker-compose.yml;
# o que esta depois dos dois pontos e o valor padrao (para rodar fora do docker).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthcare}
spring.datasource.username=${DB_USER:healthcare}
spring.datasource.password=${DB_PASS:healthcare123}

# as tabelas sao criadas pelo arquivo schema.sql toda vez que o sistema sobe
# (ele usa create table if not exists, entao nao apaga nada que ja existe).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# tempo medio de uma consulta, em minutos. usado para estimar a espera na fila (rnf03).
healthcare.tempo-medio-consulta-min=15

# mensagens de erro mais limpas e sem rastro de pilha para o usuario
server.error.include-stacktrace=never
spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false
